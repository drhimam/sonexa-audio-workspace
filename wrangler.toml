name = "sonexa"
pages_build_output_dir = "dist"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sonexa-db"
database_id = "5dc09d8f-5fe1-45bc-b5bd-736746d16840"

# Environment Variables & Secrets for Cloudflare Pages
# Set secrets via CLI:
# npx wrangler pages secret put ZEPTOMAIL_API_KEY --project-name sonexa
# npx wrangler pages secret put ZEPTOMAIL_FROM_ADDRESS --project-name sonexa
# npx wrangler pages secret put ZEPTOMAIL_ENDPOINT --project-name sonexa
# npx wrangler pages secret put JWT_SECRET --project-name sonexa
[vars]
ENVIRONMENT = "production"
ZEPTOMAIL_FROM_NAME = "Sonexa AI Meeting Copilot"
